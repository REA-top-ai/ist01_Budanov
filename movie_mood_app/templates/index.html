<!-- Объявляем HTML5-документ, чтобы браузер использовал современный режим отображения. -->
<!DOCTYPE html>
<!-- Открываем корневой тег страницы и указываем русский язык содержимого. -->
<html lang="ru">
<!-- Блок head хранит настройки страницы, которые не видны как основной контент. -->
<head>
    <!-- Задаём кодировку UTF-8, чтобы русские буквы отображались корректно. -->
    <meta charset="UTF-8">
    <!-- Настраиваем адаптивную ширину страницы на мобильных устройствах. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Задаём заголовок вкладки браузера. -->
    <title>Главная | Movie Mood App</title>
    <!-- Открываем CSS-блок со стилями этой страницы. -->
    <style>
        /* Стили для всей страницы: шрифт, фон, отступы и цвет текста. */
        body {
            font-family: Arial, sans-serif; /* Используем Arial как основной шрифт. */
            background: #f4f6f8; /* Делаем светло-серый фон вокруг основного блока. */
            margin: 0; /* Убираем стандартный внешний отступ браузера. */
            color: #222; /* Задаём тёмный цвет основного текста. */
        }
        /* Контейнер ограничивает ширину и визуально отделяет приложение от фона. */
        .container {
            max-width: 760px; /* Ограничиваем максимальную ширину формы. */
            margin: 40px auto; /* Центрируем блок и добавляем отступ сверху/снизу. */
            background: #fff; /* Делаем фон контейнера белым. */
            padding: 32px; /* Добавляем внутренние отступы. */
            border-radius: 12px; /* Скругляем углы контейнера. */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); /* Добавляем мягкую тень. */
        }
        /* Шапка держит заголовок слева и кнопки справа. */
        .header {
            display: flex; /* Включаем flex-раскладку для элементов шапки. */
            justify-content: space-between; /* Разводим левую и правую части по краям. */
            align-items: center; /* Выравниваем элементы по центру вертикали. */
            gap: 16px; /* Добавляем расстояние между элементами при переносе. */
            flex-wrap: wrap; /* Разрешаем перенос элементов на узких экранах. */
        }
        /* Главный заголовок получает компактные отступы. */
        h1 {
            margin: 0 0 8px 0; /* Убираем верхний отступ и оставляем небольшой нижний. */
        }
        /* Класс muted делает второстепенный текст менее контрастным. */
        .muted {
            color: #666; /* Задаём серый цвет для email-подписи. */
        }
        /* Поле textarea используется для ввода настроения. */
        textarea {
            width: 100%; /* Растягиваем поле на всю ширину контейнера. */
            min-height: 140px; /* Делаем поле достаточно высоким для длинного описания. */
            padding: 12px; /* Добавляем внутренние отступы текста. */
            border: 1px solid #cbd5e1; /* Рисуем светлую рамку. */
            border-radius: 8px; /* Скругляем углы поля. */
            font-size: 16px; /* Делаем текст удобным для чтения. */
            box-sizing: border-box; /* Включаем padding и border в общую ширину. */
            resize: vertical; /* Разрешаем менять высоту, но не ширину. */
        }
        /* Общие стили для кнопки отправки и ссылок-кнопок. */
        button, .link-button {
            display: inline-block; /* Позволяет задавать отступы и размеры как у блока. */
            margin-top: 16px; /* Добавляет расстояние сверху. */
            padding: 12px 20px; /* Задаёт удобный размер клика. */
            background: #1a73e8; /* Синий фон основной кнопки. */
            color: white; /* Белый текст на синем фоне. */
            text-decoration: none; /* Убирает подчёркивание у ссылок. */
            border: none; /* Убирает стандартную рамку кнопки. */
            border-radius: 8px; /* Скругляет углы кнопок. */
            cursor: pointer; /* Показывает курсор руки при наведении. */
            font-size: 16px; /* Выравнивает размер текста кнопок. */
        }
        /* Второстепенные ссылки-кнопки отличаются серым фоном. */
        .link-button.secondary {
            background: #5f6368; /* Серый фон для действий не основного приоритета. */
        }
        /* Блок actions раскладывает ссылки рядом и переносит их при нехватке места. */
        .actions {
            display: flex; /* Включаем горизонтальное расположение кнопок. */
            gap: 12px; /* Задаём расстояние между кнопками. */
            flex-wrap: wrap; /* Разрешаем перенос кнопок на следующую строку. */
            margin-top: 12px; /* Добавляем отступ сверху. */
        }
        /* Блок examples показывает подсказки пользователю. */
        .examples {
            background: #f8fafc; /* Светлый фон для отделения подсказок. */
            border-radius: 8px; /* Скругляем углы блока подсказок. */
            padding: 16px; /* Добавляем внутренний отступ. */
            margin: 24px 0; /* Добавляем вертикальное расстояние вокруг блока. */
        }
        /* Блок error показывает ошибку формы или запроса рекомендации. */
        .error {
            margin-top: 16px; /* Отделяем ошибку от формы сверху. */
            color: #b42318; /* Красный цвет текста ошибки. */
            background: #fef3f2; /* Светло-красный фон ошибки. */
            padding: 12px; /* Добавляем внутренний отступ. */
            border-radius: 8px; /* Скругляем углы блока ошибки. */
        }
    </style>
<!-- Закрываем head после настроек и стилей. -->
</head>
<!-- Открываем body: здесь находится видимое содержимое страницы. -->
<body>
    <!-- Основной контейнер главной страницы. -->
    <div class="container">
        <!-- Шапка страницы с названием, email пользователя и навигацией. -->
        <div class="header">
            <!-- Левая часть шапки с заголовком и email. -->
            <div>
                <!-- Главный заголовок объясняет назначение страницы. -->
                <h1>Подбор фильма по настроению</h1>
                <!-- Jinja вставляет email текущего пользователя из объекта user. -->
                <p class="muted">Вы вошли как <strong>{{ user.email }}</strong></p>
            </div>
            <!-- Правая часть шапки с действиями пользователя. -->
            <div class="actions">
                <!-- Ссылка открывает страницу истории рекомендаций. -->
                <a class="link-button secondary" href="/history">История</a>
                <!-- Ссылка очищает сессию и выводит пользователя из приложения. -->
                <a class="link-button secondary" href="/logout">Выйти</a>
            </div>
        </div>

        <!-- Блок примеров помогает пользователю понять, что писать в форму. -->
        <div class="examples">
            <!-- Жирная подпись вводит список примеров. -->
            <strong>Примеры настроения:</strong>
            <!-- Первый пример подходит для грустного настроения. -->
            <p>"Мне грустно, хочется чего-то доброго"</p>
            <!-- Второй пример показывает запрос на мотивационный фильм. -->
            <p>"Хочу мотивационный фильм"</p>
            <!-- Третий пример показывает спокойный атмосферный запрос. -->
            <p>"Хочу что-то атмосферное и спокойное"</p>
        </div>

        <!-- Форма отправляет настроение POST-запросом на backend-маршрут /recommend. -->
        <form action="/recommend" method="post">
            <!-- Подпись связывается с textarea через id mood. -->
            <label for="mood"><strong>Опишите своё настроение:</strong></label>
            <!-- Поле mood отправляется на сервер; Jinja возвращает прошлое значение при ошибке. -->
            <textarea id="mood" name="mood" placeholder="Например: Сегодня устал и хочу лёгкий, тёплый фильм..." required>{{ mood_value or "" }}</textarea>
            <!-- Кнопка отправляет форму на сервер. -->
            <button type="submit">Подобрать фильм</button>
        </form>

        <!-- Jinja-условие показывает блок ошибки только когда backend передал error. -->
        {% if error %}
            <!-- Выводим текст ошибки, полученный из main.py. -->
            <div class="error">{{ error }}</div>
        <!-- Закрываем условие Jinja. -->
        {% endif %}
    </div>
<!-- Закрываем body. -->
</body>
<!-- Закрываем HTML-документ. -->
</html>
