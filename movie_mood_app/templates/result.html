<!-- Объявляем документ HTML5. -->
<!DOCTYPE html>
<!-- Открываем страницу и указываем русский язык. -->
<html lang="ru">
<!-- Блок head содержит метаданные и CSS. -->
<head>
    <!-- Включаем UTF-8 для корректного русского текста. -->
    <meta charset="UTF-8">
    <!-- Делаем страницу адаптивной под ширину устройства. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Задаём заголовок вкладки браузера. -->
    <title>Результат | Movie Mood App</title>
    <!-- Открываем CSS-стили результата. -->
    <style>
        /* Общие стили страницы результата. */
        body {
            font-family: Arial, sans-serif; /* Основной шрифт интерфейса. */
            background: #f4f6f8; /* Светлый фон вокруг контейнера. */
            margin: 0; /* Убираем стандартный отступ body. */
            color: #222; /* Основной цвет текста. */
        }
        /* Центральный белый контейнер результата. */
        .container {
            max-width: 760px; /* Ограничиваем ширину контента. */
            margin: 40px auto; /* Центрируем контейнер на странице. */
            background: #fff; /* Белый фон карточки страницы. */
            padding: 32px; /* Внутренние отступы контейнера. */
            border-radius: 12px; /* Скругляем углы контейнера. */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); /* Добавляем мягкую тень. */
        }
        /* Карточка группирует отдельную часть результата. */
        .card {
            background: #f8fafc; /* Светлый фон карточки. */
            border-radius: 10px; /* Скругляем углы карточки. */
            padding: 20px; /* Добавляем внутренний отступ. */
            margin-top: 20px; /* Отделяем карточки друг от друга. */
        }
        /* Описание сохраняет переносы строк из movie_description. */
        .description {
            white-space: pre-line; /* Показываем \n как реальные переносы строк. */
            line-height: 1.6; /* Увеличиваем межстрочный интервал для читаемости. */
        }
        /* Контейнер действий показывает ссылки рядом. */
        .actions {
            display: flex; /* Раскладываем кнопки в строку. */
            gap: 12px; /* Добавляем расстояние между кнопками. */
            flex-wrap: wrap; /* Разрешаем перенос на маленьких экранах. */
            margin-top: 24px; /* Отделяем действия от карточек. */
        }
        /* Ссылки выглядят как кнопки. */
        .button {
            display: inline-block; /* Делаем ссылку блочно-строчной для padding. */
            padding: 12px 20px; /* Задаём удобную область клика. */
            background: #1a73e8; /* Основной синий цвет кнопки. */
            color: white; /* Белый текст кнопки. */
            text-decoration: none; /* Убираем подчёркивание ссылки. */
            border-radius: 8px; /* Скругляем углы кнопки. */
        }
        /* Второстепенная кнопка получает серый фон. */
        .button.secondary {
            background: #5f6368; /* Серый цвет для менее важного действия. */
        }
    </style>
<!-- Закрываем head. -->
</head>
<!-- Открываем видимое тело страницы. -->
<body>
    <!-- Основной контейнер результата рекомендации. -->
    <div class="container">
        <!-- Заголовок сообщает, что рекомендация уже получена. -->
        <h1>Фильм подобран</h1>
        <!-- Jinja подставляет email текущего пользователя. -->
        <p>Пользователь: <strong>{{ user.email }}</strong></p>

        <!-- Карточка показывает настроение, которое пользователь отправил. -->
        <div class="card">
            <!-- Подпись поля настроения. -->
            <p><strong>Ваше настроение:</strong></p>
            <!-- Jinja выводит сохранённое настроение из MovieRequest. -->
            <p>{{ movie_request.mood }}</p>
        </div>

        <!-- Карточка показывает название рекомендованного фильма. -->
        <div class="card">
            <!-- Подпись поля названия фильма. -->
            <p><strong>Название фильма:</strong></p>
            <!-- Jinja выводит название фильма из сохранённой рекомендации. -->
            <p>{{ movie_request.movie_title }}</p>
        </div>

        <!-- Карточка показывает объяснение рекомендации. -->
        <div class="card">
            <!-- Подпись поля описания. -->
            <p><strong>Почему этот фильм подходит:</strong></p>
            <!-- Jinja выводит описание; CSS сохраняет переносы строк. -->
            <p class="description">{{ movie_request.movie_description }}</p>
        </div>

        <!-- Блок навигационных действий после просмотра результата. -->
        <div class="actions">
            <!-- Возвращает пользователя на форму подбора нового фильма. -->
            <a class="button" href="/">Подобрать ещё</a>
            <!-- Открывает историю прошлых рекомендаций. -->
            <a class="button secondary" href="/history">Посмотреть историю</a>
        </div>
    </div>
<!-- Закрываем body. -->
</body>
<!-- Закрываем HTML-документ. -->
</html>
